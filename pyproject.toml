[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-foundry"
version = "0.1.0"
description = "A configurable, local-first multi-agent factory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.1.3,<1.2",
    "fastapi>=0.140.13,<0.142",
    "langchain-mcp-adapters>=0.3.0,<0.4",
    "langchain-ollama>=1.0.1,<1.2",
    "langgraph>=1.2.10,<1.3",
    "langgraph-checkpoint-sqlite>=3.0.3,<3.2",
    "mcp>=1.29.1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
